name: ProfitLens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Test Suite
        env:
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "ci-test-secret-long-key-for-profitlens-testing-360"
        run: npm test

      - name: Build Next.js Application
        env:
          DATABASE_URL: "file:./dev.db"
          JWT_SECRET: "ci-test-secret-long-key-for-profitlens-testing-360"
        run: npm run build
